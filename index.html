<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col justify-between">

  <!-- صندوق الطلب الرئيسي -->
  <div class="w-full max-w-lg mx-auto bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 my-auto">
    
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        توصيل السوبرماركت للسكن (فترتي 5:00 م و 10:00 م)
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white">تسجيل طلب السوبرماركت</h1>
    </div>

    <!-- تايمر موحد وبسيط -->
    <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-700/80 flex items-center justify-between">
      <div>
        <span class="text-slate-400 block text-xs font-semibold">أقرب موعد قفل قادم</span>
        <span id="shiftTitleDisplay" class="font-bold text-emerald-400 text-sm sm:text-base">فترة 5:00 عصراً (قفل 4:30)</span>
      </div>
      <div class="text-left">
        <span class="text-slate-400 block text-xs font-semibold">متبقي</span>
        <span id="timerCountdown" class="font-mono font-extrabold text-amber-400 text-lg sm:text-xl">--:--:--</span>
      </div>
    </div>

    <!-- استمارة الطالب -->
    <form id="orderForm" class="space-y-4" onsubmit="event.preventDefault(); window.submitStudentOrder();">
      
      <!-- اختيار فترة الاستلام -->
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">اختر فترة الاستلام المناسبة لك</label>
        <div class="grid grid-cols-2 gap-3">
          
          <label id="labelShift5" class="relative flex flex-col p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition">
            <div class="flex items-center gap-2">
              <input type="radio" name="deliveryShift" value="5PM" id="shift5Radio" checked class="text-emerald-500 focus:ring-0">
              <span class="font-bold text-sm text-white">5:00 عصراً</span>
            </div>
            <span id="subtextShift5" class="text-[11px] text-slate-400 mt-1">تقفل 4:30 م للتجهيز</span>
          </label>

          <label id="labelShift10" class="relative flex flex-col p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition">
            <div class="flex items-center gap-2">
              <input type="radio" name="deliveryShift" value="10PM" id="shift10Radio" class="text-emerald-500 focus:ring-0">
              <span class="font-bold text-sm text-white">10:00 مساءً</span>
            </div>
            <span id="subtextShift10" class="text-[11px] text-slate-400 mt-1">تقفل 9:30 م للتجهيز</span>
          </label>

        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">الاسم</label>
        <input type="text" id="studentName" required placeholder="اكتب اسمك هنا" 
               class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">مكان السكن / الغرفة</label>
        <input type="text" id="roomNumber" required placeholder="مثال: أوضة ٣ دور أول علوي" 
               class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">رقم الواتساب للتواصل</label>
        <input type="tel" id="whatsappNumber" required placeholder="مثال: 01xxxxxxxxx" 
               class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition text-right">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">الأوردر بالتفصيل والكميات</label>
        <textarea id="orderItems" required rows="4" 
                  placeholder="مثال:&#10;2 كيس شيبسي بالجبنة كبير&#10;1 عصير جهينة مانجو" 
                  class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition text-sm leading-relaxed"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">ملاحظة أو بديل (اختياري)</label>
        <input type="text" id="orderNotes" placeholder="مثال: لو الحجم الكبير مش موجود هات الوسط" 
               class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition text-sm">
      </div>

      <button type="submit" id="submitBtn" 
              class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-base rounded-xl shadow-lg shadow-emerald-500/20 active:scale-[0.99] transition duration-150">
        إرسال الطلب (Submit)
      </button>

    </form>

    <!-- شاشة تأكيد النجاح بعد إرسال الطلب -->
    <div id="successBox" class="hidden p-6 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-center space-y-3">
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
      <h3 class="font-bold text-lg text-emerald-400">تم تسجيل طلبك بنجاح!</h3>
      <p class="text-xs text-slate-400" id="successShiftNotice">سيتم تجهيز طلبك في موعد الدفعة المحددة.</p>
      <button type="button" onclick="window.resetFormView()" class="text-xs text-emerald-400 underline hover:text-emerald-300">تسجيل طلب آخر</button>
    </div>

  </div>

  <!-- زر الوصول السري للجنة -->
  <div class="text-center py-4">
    <button type="button" onclick="window.openPinModal()" class="text-xs text-slate-500 hover:text-slate-400 transition underline">
      كشف إدارة اللجنة
    </button>
  </div>

  <!-- نافذة الرمز السري (PIN) -->
  <div id="pinModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-xs space-y-4 text-center">
      <h3 class="font-bold text-white text-lg">دخول مسؤولي اللجنة</h3>
      <input type="password" id="pinInput" maxlength="6" placeholder="أدخل الرمز السري" 
             class="w-full text-center tracking-widest text-xl py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500">
      <p id="pinError" class="text-rose-400 text-xs hidden">الرمز السري غير صحيح</p>
      <div class="flex gap-2">
        <button type="button" onclick="window.verifyPin()" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-sm">دخول</button>
        <button type="button" onclick="window.closePinModal()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-sm">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- لوحة تحكم اللجنة ونسخ رسالة الواتساب -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] flex flex-col space-y-4 text-right">
      
      <div class="flex items-center justify-between pb-3 border-b border-slate-700">
        <div>
          <h2 class="font-extrabold text-white text-lg">لوحة طلبات اللجنة</h2>
          <span id="orderCountText" class="text-xs text-emerald-400">جارٍ جلب الطلبات...</span>
        </div>
        <button type="button" onclick="window.closeAdminModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>

      <!-- فلترة عرض الطلبات حسب الفترة -->
      <div class="flex gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
        <button type="button" onclick="window.changeAdminFilter('ALL')" id="filterAllBtn" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white">الكل</button>
        <button type="button" onclick="window.changeAdminFilter('5PM')" id="filter5Btn" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white">فترة 5:00 عصراً</button>
        <button type="button" onclick="window.changeAdminFilter('10PM')" id="filter10Btn" class="flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white">فترة 10:00 مساءً</button>
      </div>

      <!-- زر نسخ الرسالة للسوبرماركت مباشرة -->
      <button type="button" onclick="window.copySupermarketMessage()" 
              class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
        <span id="copyBtnText">نسخ رسالة السوبرماركت للفترة المختارة</span>
      </button>

      <!-- استعراض نص الرسالة المنسوخة النظيفة للسوبرماركت -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-400">نص الرسالة المنسوخة للسوبرماركت</label>
        <pre id="previewBox" class="p-4 bg-slate-950 rounded-xl border border-slate-900 text-slate-200 text-xs font-mono whitespace-pre-wrap max-h-48 overflow-y-auto"></pre>
      </div>

      <!-- كشف التسليم الداخلي للجنة -->
      <div class="space-y-1 pt-2">
        <label class="text-xs font-semibold text-slate-400">كشف الطلاب للتسليم والتواصل</label>
        <div id="studentsList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-700/80">
        <button type="button" onclick="window.clearAllOrders()" class="text-xs text-rose-400 hover:text-rose-300 underline">مسح كل الطلبات لبدء فترة جديدة</button>
        <button type="button" onclick="window.closeAdminModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded-xl">إغلاق</button>
      </div>

    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://supermarket-438b0-default-rtdb.firebaseio.com/";
    const COMMITTEE_PIN = "020260";
    let loadedOrders = [];
    let currentAdminFilter = "ALL";

    function updateTimings() {
      const now = new Date();
      const currentTotalMin = now.getHours() * 60 + now.getMinutes();

      const isShift5Closed = (currentTotalMin >= 16 * 60 + 30 && currentTotalMin < 17 * 60);
      const isShift10Closed = (currentTotalMin >= 21 * 60 + 30 && currentTotalMin < 22 * 60);

      const radio5 = document.getElementById('shift5Radio');
      const radio10 = document.getElementById('shift10Radio');
      const label5 = document.getElementById('labelShift5');
      const label10 = document.getElementById('labelShift10');
      const subtext5 = document.getElementById('subtextShift5');
      const subtext10 = document.getElementById('subtextShift10');

      if (radio5 && label5 && subtext5) {
        if (isShift5Closed) {
          radio5.disabled = true;
          label5.className = "relative flex flex-col p-3 bg-slate-900 border border-slate-800 rounded-xl opacity-40 cursor-not-allowed";
          subtext5.innerText = "مغلقة للتجهيز (تفتح 5:00 م)";
          if (radio5.checked && radio10) radio10.checked = true;
        } else {
          radio5.disabled = false;
          label5.className = "relative flex flex-col p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition";
          subtext5.innerText = "تقفل 4:30 م للتجهيز";
        }
      }

      if (radio10 && label10 && subtext10) {
        if (isShift10Closed) {
          radio10.disabled = true;
          label10.className = "relative flex flex-col p-3 bg-slate-900 border border-slate-800 rounded-xl opacity-40 cursor-not-allowed";
          subtext10.innerText = "مغلقة للتجهيز (تفتح 10:00 م)";
          if (radio10.checked && radio5) radio5.checked = true;
        } else {
          radio10.disabled = false;
          label10.className = "relative flex flex-col p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition";
          subtext10.innerText = "تقفل 9:30 م للتجهيز";
        }
      }

      let nextCloseDate = new Date();
      let shiftLabel = "";

      if (currentTotalMin < 16 * 60 + 30) {
        shiftLabel = "فترة 5:00 عصراً (قفل 4:30)";
        nextCloseDate.setHours(16, 30, 0, 0);
      } else if (currentTotalMin < 21 * 60 + 30) {
        shiftLabel = "فترة 10:00 مساءً (قفل 9:30)";
        nextCloseDate.setHours(21, 30, 0, 0);
      } else {
        shiftLabel = "فترة 5:00 عصر الغد (قفل 4:30)";
        nextCloseDate.setDate(nextCloseDate.getDate() + 1);
        nextCloseDate.setHours(16, 30, 0, 0);
      }

      const shiftTitleEl = document.getElementById('shiftTitleDisplay');
      if (shiftTitleEl) shiftTitleEl.innerText = shiftLabel;

      const diffSec = Math.max(0, Math.floor((nextCloseDate - now) / 1000));
      const hours = String(Math.floor(diffSec / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
      const seconds = String(diffSec % 60).padStart(2, '0');

      const timerEl = document.getElementById('timerCountdown');
      if (timerEl) timerEl.innerText = `${hours}:${minutes}:${seconds}`;
    }

    updateTimings();
    setInterval(updateTimings, 1000);

    window.submitStudentOrder = async function() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "جارٍ الإرسال...";

      const checkedRadio = document.querySelector('input[name="deliveryShift"]:checked');
      const selectedShift = checkedRadio ? checkedRadio.value : "5PM";
      const now = new Date();
      const timeFormatted = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

      const newOrder = {
        name: document.getElementById('studentName').value.trim(),
        room: document.getElementById('roomNumber').value.trim(),
        whatsapp: document.getElementById('whatsappNumber').value.trim(),
        items: document.getElementById('orderItems').value.trim(),
        notes: document.getElementById('orderNotes').value.trim(),
        shift: selectedShift,
        orderTime: timeFormatted,
        createdAt: now.toISOString()
      };

      try {
        const res = await fetch(`${FIREBASE_DB_URL}orders.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newOrder)
        });

        if (res.ok) {
          document.getElementById('orderForm').classList.add('hidden');
          const shiftTitle = selectedShift === "5PM" ? "فترة 5:00 عصراً" : "فترة 10:00 مساءً";
          document.getElementById('successShiftNotice').innerText = `تم تسجيل طلبك بنجاح ضمن (${shiftTitle}).`;
          document.getElementById('successBox').classList.remove('hidden');
          document.getElementById('orderForm').reset();
        } else {
          alert("حدث خطأ في الاتصال بالسيرفر.");
        }
      } catch (err) {
        alert("تعذر إرسال الطلب، تأكد من الاتصال بالإنترنت.");
      } finally {
        btn.disabled = false;
        btn.innerText = "إرسال الطلب (Submit)";
      }
    };

    window.resetFormView = function() {
      document.getElementById('successBox').classList.add('hidden');
      document.getElementById('orderForm').classList.remove('hidden');
      updateTimings();
    };

    window.openPinModal = function() {
      document.getElementById('pinInput').value = "";
      document.getElementById('pinError').classList.add('hidden');
      document.getElementById('pinModal').classList.remove('hidden');
    };

    window.closePinModal = function() {
      document.getElementById('pinModal').classList.add('hidden');
    };

    window.verifyPin = function() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === COMMITTEE_PIN) {
        window.closePinModal();
        window.openAdminDashboard();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
      }
    };

    window.openAdminDashboard = async function() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('orderCountText').innerText = "جارٍ جلب البيانات...";

      try {
        const res = await fetch(`${FIREBASE_DB_URL}orders.json`);
        const data = await res.json();
        loadedOrders = [];

        if (data) {
          loadedOrders = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        }

        renderAdminOrders();
      } catch (err) {
        document.getElementById('orderCountText').innerText = "خطأ في جلب الطلبات";
      }
    };

    window.closeAdminModal = function() {
      document.getElementById('adminModal').classList.add('hidden');
    };

    window.changeAdminFilter = function(filter) {
      currentAdminFilter = filter;
      const allBtn = document.getElementById('filterAllBtn');
      const f5Btn = document.getElementById('filter5Btn');
      const f10Btn = document.getElementById('filter10Btn');

      [allBtn, f5Btn, f10Btn].forEach(b => {
        b.className = "flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white";
      });

      if (filter === 'ALL') allBtn.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
      if (filter === '5PM') f5Btn.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";
      if (filter === '10PM') f10Btn.className = "flex-1 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white";

      renderAdminOrders();
    };

    function getFilteredOrders() {
      if (currentAdminFilter === 'ALL') return loadedOrders;
      return loadedOrders.filter(ord => (ord.shift || '5PM') === currentAdminFilter);
    }

    function generateSupermarketText() {
      const filtered = getFilteredOrders();
      if (filtered.length === 0) return "لا توجد طلبات مسجلة لهذه الفترة حالياً.";

      return filtered.map((ord, idx) => {
        const lines = ord.items.split('\n').filter(l => l.trim() !== "");
        const formattedItems = lines.map(l => `- ${l.trim()}`).join('\n');
        let block = `${idx + 1}-\n${formattedItems}`;
        if (ord.notes) block += `\n- ملاحظة: ${ord.notes}`;
        block += `\n- الحساب: `;
        return block;
      }).join('\n\n');
    }

    function renderAdminOrders() {
      const filtered = getFilteredOrders();
      document.getElementById('orderCountText').innerText = `إجمالي الطلبات: ${filtered.length} (من أصل ${loadedOrders.length})`;
      document.getElementById('previewBox').innerText = generateSupermarketText();

      const listContainer = document.getElementById('studentsList');
      listContainer.innerHTML = "";
      filtered.forEach((ord, idx) => {
        const phone = ord.whatsapp ? ord.whatsapp.replace(/[^0-9]/g, '') : '';
        const waLink = phone.startsWith('01') ? `https://wa.me/2${phone}` : `https://wa.me/${phone}`;
        const timeDisplay = ord.orderTime || (ord.createdAt ? new Date(ord.createdAt).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '');
        const shiftTag = ord.shift === "10PM" ? "10 مساءً" : "5 عصراً";

        const item = docume
